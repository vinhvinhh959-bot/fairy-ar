<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rừng nhiệt đới AR</title>
<style>
:root{--bg:#04140a;--fg:#eafff0;--ac:#7dff9b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#ui{position:fixed;left:0;right:0;bottom:0;text-align:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#box{display:inline-block;max-width:420px;background:rgba(4,30,14,.8);border:1px solid var(--ac);border-radius:16px;padding:14px 18px}
button{background:var(--ac);color:#04200d;border:0;border-radius:999px;padding:10px 22px;font-size:16px;font-weight:600}
#flip{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;padding:8px 14px;font-size:14px}
p{margin:0 0 10px;font-size:14px;line-height:1.45}
[hidden]{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted hidden></video>
<div id="ui"><div id="box">
<p id="msg">Bật camera rồi nhìn quanh: cảnh sẽ thành rừng nhiệt đới. Vẫy tay để dây leo mọc và bướm bay theo. Chạm màn hình cũng mọc dây leo.</p>
<button id="go">Bật camera</button></div>
<button id="flip" hidden>⟲ Đổi camera</button></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),v=document.getElementById('v'),
msg=document.getElementById('msg'),go=document.getElementById('go'),box=document.getElementById('box'),flip=document.getElementById('flip');
const R=Math.random,PI=Math.PI,GW=64,GH=48;
const sc=document.createElement('canvas');sc.width=GW;sc.height=GH;
const sx=sc.getContext('2d',{willReadFrequently:true});
let W,H,F=[],prev=null,cam=false,facing='environ
